<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Splash · Sonar Ping</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; font-family: Inter, system-ui, sans-serif; overflow:hidden; }
  body {
    background: linear-gradient(135deg, #020b18 0%, #0D2B4E 55%, #1A4A80 100%);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .preview-frame {
    width: 420px; height: 520px; border-radius: 20px; overflow:hidden;
    background: linear-gradient(135deg, #020b18 0%, #0D2B4E 55%, #1A4A80 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
  }
  .preview-frame::before {
    content:""; position:absolute; top:42%; left:50%;
    width:520px; height:520px; transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(46,125,209,0.18) 0%, transparent 60%);
    pointer-events:none;
  }

  .stage {
    position:relative; width: 240px; height: 240px;
    display:flex; align-items:center; justify-content:center;
  }

  /* Ondas concêntricas saindo do centro */
  .wave {
    position:absolute; top:50%; left:50%; transform: translate(-50%, -50%) scale(0);
    width: 100px; height: 100px; border-radius:50%;
    border: 2px solid rgba(91,164,229,0.6);
    animation: ping 2.4s cubic-bezier(0.2, 0.6, 0.2, 1) infinite;
    opacity: 0;
  }
  .wave.w2 { animation-delay: 0.8s; }
  .wave.w3 { animation-delay: 1.6s; }
  @keyframes ping {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0;    border-width: 3px; }
    15%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0;    border-width: 1px; }
  }

  /* Núcleo */
  .core {
    position:relative; z-index:2;
    width: 110px; height: 110px; border-radius:50%;
    background: radial-gradient(circle, rgba(91,164,229,0.45), rgba(91,164,229,0) 70%);
    display:flex; align-items:center; justify-content:center;
    animation: corePulse 2.4s ease-in-out infinite;
  }
  @keyframes corePulse {
    0%, 100% { transform: scale(1);   box-shadow: 0 0 24px rgba(91,164,229,0.55); }
    50%      { transform: scale(1.05); box-shadow: 0 0 48px rgba(91,164,229,0.85); }
  }
  .core img { width: 70px; height: 70px; filter: brightness(2) drop-shadow(0 0 14px rgba(91,164,229,0.7)); }

  .title { margin-top: 28px; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
  .title em { font-style: normal; color: #5BA4E5; }
  .ver { color: rgba(255,255,255,0.35); font-size: 11px; font-weight: 500; margin-top:6px; }

  .footer {
    position:absolute; bottom: 22px; left:0; right:0; text-align:center;
    color: rgba(255,255,255,0.28); font-size: 11px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .footer svg { width:12px; height:12px; }
</style>
</head>
<body>
  <div class="preview-frame">
    <div class="stage">
      <div class="wave w1"></div>
      <div class="wave w2"></div>
      <div class="wave w3"></div>
      <div class="core">
        <img src="/logos/icon.png" alt="Contourline" />
      </div>
    </div>
    <div class="title">Iniciando <em>Contourline</em></div>
    <div class="ver">versão 1.0.0</div>
    <div class="footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Seus dados estão protegidos
    </div>
  </div>
</body>
</html>
